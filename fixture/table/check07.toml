[[row]]
id = "c07.R3.GM"
question = "With the generating-model rule on, what does the record GM of R3 answer under withdraw A?"
plan = "5.5 Check 7 (extension row); 2.2(h); 3.3; L11"
core = false
extension = "generating-model"
given = { request = "withdraw A", artifact = "R3", record = "GM", extensions_on = ["generating-model"] }
expect = { answer = "may contain", names = "generating-model entry missing", failing = { condition = "h", job = "model-entry-removed" } }
source = "hand-written table: its harness log has no model entry, which is read as not established; the answer names the job and the missing model entry (2.2(h)); the job is the one the fixture declares for the GM row of fixture/sources/generation_r3.jsonl (plan line 302)"

[[row]]
id = "c07.R3.release"
question = "With the generating-model rule on, what does R3 answer as a whole, and which records does the report list as unresolved?"
plan = "5.5 Check 7 (extension row); 4.1; 2.2(h)"
core = false
extension = "generating-model"
given = { request = "withdraw A", artifact = "R3", extensions_on = ["generating-model"] }
expect = { answer = "may contain", unresolved = ["G9", "GU", "GM"], not_unresolved = ["G6"] }
source = "hand-written table: no record of R3 shows \"contains\" and three of its four records answer \"may contain\"; a \"may contain\" record has no action and is listed as unresolved (4.1)"
