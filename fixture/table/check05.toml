# ==================================================================================
# C1. A record-level request about B, with an observed link to A and a file-level
# link to B (plan 5.5 Check 5; 2.2(b); Decision 3).
# The state: P in gen/P keeps its observed edge to X@A. Through the write API one
# source link is added from P's occurrence to the member B/r1, label "file-level"
# (set-up s.file-level-link-B). The request names the one record X@B of source B.
# ==================================================================================

[[row]]
id = "c05.record-X@B.unmutated.gen/P"
question = "Before the file-level link is added, what does gen/P answer for the record X@B of source B?"
plan = "5.5 Check 5; 2.2(g); 2.1"
core = true
given = { request = "withdraw B, record X@B", artifact = "gen/P", state = "unmutated" }
expect = { answer = "does not contain", notes = ["generating-model exposure not assessed"] }
source = "hand-written table: P's edge names X@A only and its upper bound is established, so the proof passes a generation edge for a source it does not name and carries the words of 2.2(h) for the off state"

[[row]]
id = "c05.record-X@B.file-level-link.gen/P"
question = "With an observed link to A and a file-level link to B on P, what does gen/P answer for the record X@B of source B?"
plan = "5.5 Check 5; 2.2(b); 3.2; Decision 3"
core = true
given = { request = "withdraw B, record X@B", artifact = "gen/P", state = "s.file-level-link-B" }
expect = { answer = "may contain", names = "evidence level cannot decide the request", failing = { condition = "b", artifact = "gen/P", record = "P" } }
source = "hand-written table: evidence levels are kept per (occurrence, requested source); the observed link to A never masks the file-level link to B, and a file-level link cannot decide a record-level request (2.2(b), 3.2)"

