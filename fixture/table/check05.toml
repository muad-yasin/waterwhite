core = true
given = { request = "withdraw C", artifact = "E/shard-3", state = "unmutated" }
expect = { answer = "does not contain", notes = ["generating-model exposure not assessed"], scope = { source = "C", members = ["C/r1"], generation_edges = ["translation", "paraphrase"] } }
source = "hand-written table: T runs through P to X@A and no edge on that chain names C; both generation edges have their upper bound established, and the proof lists them (L8). With the generating-model extension off the answer says what was not assessed"

[[row]]
id = "c05.withdraw-C.unmutated.R1"
question = "Under withdraw C, unmutated, what does R1 answer?"
plan = "5.5 Check 5; 2.1; Decision 25"
core = true
given = { request = "withdraw C", artifact = "R1", state = "unmutated" }
expect = { answer = "contains", chain = ["R1:S", "gen/S:S", "src/C:SC"], notes = ["the parent list is process evidence (what the harness handed the job and what the output states it used), not proof that the output depends on the source"] }
source = "hand-written table: R1 holds S, and S states its use of C's passage SC; the chain passes a generation edge, so the answer carries the process-evidence note (2.1)"

[[row]]
id = "c05.g.bound-field.E/shard-3"
