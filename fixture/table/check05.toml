given = { request = "withdraw C", artifact = "E/shard-3", state = "g.model-entry-removed", extensions_on = ["generating-model"] }
expect = { answer = "may contain", names = "generating-model entry missing", failing = { condition = "h", job = "paraphrase" } }
source = "hand-written table: a log with no model entry is read as not established, never as no model; the answer names the job and the missing model entry (2.2(h))"

[[row]]
id = "c05.g.model-entry-removed.off.E/shard-3"
question = "With the generating-model rule off and the model entry removed from the stored log of P's job, what does shard 3 answer under withdraw C?"
