core = true
given = { request = "withdraw C", artifact = "E/shard-3", state = "g.model-entry-removed" }
expect = { answer = "does not contain", notes = ["generating-model exposure not assessed"] }
source = "hand-written table: while the extension is off the model is a logged attribute and condition (h) is not applied; the reads of the log are unchanged, so the bound stands and the unmutated answer stands. This row is the off state of the extension row above"

[[row]]
