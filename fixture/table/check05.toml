plan = "5.5 Check 5; 2.2(g); 3.3; Decision 13; L8"
core = true
given = { request = "withdraw C", artifact = "E/shard-3", state = "g.bound-field" }
expect = { answer = "may contain", names = "upper bound not established", failing = { condition = "g", job = "paraphrase" } }
source = "hand-written table: a negative for a source an edge does not name needs that edge's established bound; without it the answer is \"may contain\" naming the job (2.2(g))"

[[row]]
id = "c05.g.log-outside-read.E/shard-3"
question = "With a read of a record outside its hand-off added to the stored log of P's job, what does shard 3 answer under withdraw C?"
