core = true
given = { request = "withdraw C", artifact = "E/shard-3", state = "g.log-outside-read" }
expect = { answer = "may contain", names = "upper bound not established", failing = { condition = "g", job = "paraphrase" } }
source = "hand-written table: the bound is read from the stored log, which now lists a record beyond the handed ones, so it is not established (3.3)"

[[row]]
id = "c05.g.log-removed.E/shard-3"
question = "With the harness log of P's edge removed and its bound field left at established, what does shard 3 answer under withdraw C?"
plan = "5.5 Check 5; 2.2(g) (never from a bound field alone); 3.1 (Edge)"
core = true
given = { request = "withdraw C", artifact = "E/shard-3", state = "g.log-removed" }
expect = { answer = "may contain", names = "upper bound not established", failing = { condition = "g", job = "paraphrase" } }
source = "hand-written table: the bound is established only from the edge's stored harness log; a field that says established with no log behind it is not a bound (2.2(g))"

[[row]]
id = "c05.g.model-entry-removed.on.E/shard-3"
question = "With the generating-model rule on and the model entry removed from the stored log of P's job, what does shard 3 answer under withdraw C?"
