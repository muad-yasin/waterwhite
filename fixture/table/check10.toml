[[row]]
id = "c10.c01.E@9.manifest"
question = "Under withdraw A, does checkpoint 9 keep \"contains\" while step 8 is untraced?"
plan = "5.5 Check 10; 5.5 Check 1"
core = true
given = { subject = "manifest", group = "c01.E@9", conditions = ["written while the build runs"] }
record = "the artifact's row and the rows reached from it through built_from"
route = "follow built_from from the artifact's row, row by row, down to the rows of source files"
rule = "contains: the walk reaches the file of a member the request names. does not contain: the artifact has a row and the walk reaches no such file. no record: the artifact has no row. A name with no row of its own ends its branch, and the manifest has no check that reports it. Only the answer is compared; the first exposure, the basis and the untraced steps of the listed row are not."
