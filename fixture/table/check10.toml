core = true
given = { subject = "trace", group = "c04.interrupted-write", conditions = ["the join's own position output"] }
record = "none"
missing = "a per-document map and a writer of one: the trace holds positions only"
rule = "cannot answer; the evidence is the missing record or field"
marks = []
excluded_from_tally = false
needs_ordinal = false
source = "hand-written table: as each row of the group names it"
expect = { one_of = ["cannot answer"] }

[[row]]
id = "c10.c04.interrupted-write.dolma"
question = "After the writer of a 500-row map is stopped part way, is the map absent or complete; and after the write is made again, is it complete and bound to its shard, or refused?"
plan = "5.5 Check 10; 5.5 Check 4"
core = true
given = { subject = "dolma", group = "c04.interrupted-write", conditions = ["sandbox", "relative paths", "row count checked"] }
record = "the companion rows the tokenizer wrote for the 500-line file, and its token file"
route = "count the companion rows whose src is that file after the stop, and again after the retry"
rule = "c04.kill-after-100: the number of rows after the stop. c04.retry: the number of rows after the second run, whether their ranges index the documents of the token file, and whether the tool refused instead."
fault = "the fault is put to the toolkit's own writer: the tokenizer is started on the 500-line file of the scratch-500 set-up and stopped by its process id while it runs, at the first moment its output holds a companion file with 100 or more rows, or, where it writes the companion rows only when it finishes, at any moment before it exits; the recorded answer says which. For c04.retry the same command is then run again on the same output folder."
marks = []
excluded_from_tally = false
needs_ordinal = false
source = "hand-written table: as each row of the group names it"
[row.expect]
one_of = ["right", "wrong"]
right = "after the stop there is no row for the file, or there are 500; after the retry there are 500 rows that index the 500 documents of the token file, or the tool refused the write with an error"
wrong = "after the stop there are between 1 and 499 rows; after the retry there is another number of rows than 500, or rows that do not match the token file"

