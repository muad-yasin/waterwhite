record = "the trace's rows (segment, step, shard, ordinal) for the steps of the checkpoint's history, and for each the companion row of that document"
route = "the history is read from the trace: the checkpoint's segment up to its step, then the history of its parent checkpoint. Each trace row is tied to the companion row of its document (the two readings under ordinal), and the tied row's id is resolved to the file that holds it"
rule = "contains: a tied row's id resolves to the file of a member the request names. does not contain: the history has trace rows, every tied row's id resolves to a source file, and none is the file of such a member. no record: the trace does not hold the checkpoint, or holds no row for any step of its history. cannot answer: no tied row names such a member and a tied row's id resolves to a generation output or to no file. A step with no trace row, an uncovered range and a trace row with no companion row add nothing to the reading; neither half has a check that reports them. The trace read here is the one this tool writes when the runs are registered from the starting state of the listed row (c2.i to c2.iv); a segment for which that registration writes no trace has no row. Only the answer is compared; the named cause is not."
