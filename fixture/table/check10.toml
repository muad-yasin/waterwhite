# Check 10, the baselines (plan 5.5 Check 10). The reading rules, written before any
# baseline ran. Conventions, the six subjects, their own records, the conditions of
# a run, the grades and the groups: README.md, section "Check 10".
#
# A [[group]] is a set of rows of check01.toml to check09.toml that ask the same
# question; `rows` lists them by id. Every core row of Checks 1 to 9 is in exactly
# one group. Each group is followed by its six [[row]] entries, one per subject.
#
# No row holds an expected result. `expect.one_of` lists the grades the rule can
# lead to; `right`, `wrong` and `cannot_answer` say what earns each. A row whose
# `record` is "none" names in `missing` the record or field the subject lacks; it
# is recorded as cannot answer only after the subject has run.
#
# Nothing here comes from an output of the tool or of a baseline (plan W5).


# ==================================================================================
# The questions of Check 1
# ==================================================================================

[[group]]
id = "c01.positions"
check = 1
question = "Do the rows (step, shard, ordinal, token start, token end) reported for runs E, E-rr and K equal the oracle's log, over each whole run and at each position the fixture names?"
rows = [
    "c01.E.diff",
    "c01.E.T",
    "c01.E.skipped-line",
    "c01.E.repeated-draw",
    "c01.E.shared-ordinal",
    "c01.E.split-document",
    "c01.E.shared-token",
    "c01.E.step8.first-half",
    "c01.E-rr.diff",
    "c01.K.diff",
    "c01.K.epoch-boundary",
]
source = "the oracle's log: the source each row of the group names. A grade is taken against that row's expect, or against its expect_under when the fallback it names is in force"

[[row]]
