question = "Unmutated, what does each artifact that holds or read T, and gen/S, answer for the record X@A alone?"
plan = "5.5 Check 10; 5.5 Check 5"
core = true
given = { subject = "dolma+trace", group = "c05.record-X@A.unmutated", conditions = ["sandbox", "relative paths", "row count checked", "the join's own position output"] }
record = "the trace's rows (segment, step, shard, ordinal) for the steps of the checkpoint's history, and for each the companion row of that document; for a shard, the companion rows of its chunk file"
route = "the history is read from the trace: the checkpoint's segment up to its step, then the history of its parent checkpoint. Each trace row is tied to the companion row of its document (the two readings under ordinal), and the tied row's id is resolved to the file that holds it"
rule = "E/shard-3 is read as by the toolkit alone (row c10.c05.record-X@A.unmutated.dolma), a checkpoint by the checkpoint rule below; the generation outputs and the mixtures listed are cannot answer, with the missing records named in the rows c10.c05.unmutated.files.dolma+trace and c10.c05.unmutated.mixtures.dolma+trace. The request names one record. Checkpoint rule for a request narrowed to one record: contains: a tied row's id is the id of the named record. does not contain: the history has trace rows, every tied row's id resolves to a source file, and none is the named record. no record: the trace does not hold the checkpoint, or holds no row for any step of its history. cannot answer: no tied row is the named record and a tied row's id resolves to a generation output or to no file. A step with no trace row, an uncovered range and a trace row with no companion row add nothing to the reading. Only the answer is compared."
marks = ["step-to-ordinal part is the tool's own output"]
excluded_from_tally = false
needs_ordinal = true
source = "hand-written table: as each row of the group names it"
[row.expect]
one_of = [
    "right",
    "wrong",
    "cannot answer",
]
right = "the reading equals the outcome of the listed row: \"contains\", \"does not contain\", no record for \"not covered\", stopped for a row that expects an error"
wrong = "the reading is an answer or a stop and it is not the outcome of the listed row; \"does not contain\" read from a gap is wrong like any other answer"
cannot_answer = "the listed artifact is of a kind neither half holds a record for; or, for a shard or a checkpoint: a consumed document's row resolves to a generation output and the toolkit has no derived-from link that says what that record was made from; or the tie to an ordinal is not shown (ordinal)"
[row.ordinal]
selector = "document i is line i"
what_is_shown = "on the replica's chunk files, under the replica's settings (one preprocessing partition, or --keep-sequential-samples), the document with ordinal n of a shard (counted from 0) is line n + 1 of its chunk file (counted from 1)"
applies_to = "the listed questions about a checkpoint"
[row.ordinal.shown]
name = "tie by src and loc"
rule = "the document with ordinal n of a shard is tied to the companion row whose src is the shard's chunk file and whose loc is n + 1, never by the row's place in the companion file"
mark = "ordinal derived from src and loc (owner's ruling after the debate)"
grades = [
    "right",
    "wrong",
    "cannot answer",
]
[row.ordinal.not_shown]
name = "cannot answer"
rule = "the question is recorded as cannot answer"
evidence = "the missing tie: nothing shown ties a companion row to an ordinal of the replica's shard"
grades = ["cannot answer"]

