[[row]]
id = "c10.c07.R3-release.manifest"
question = "With the generating-model rule on, what does R3 answer as a whole, and which records does the report list as unresolved?"
plan = "5.5 Check 10; 5.5 Check 7 (extension row); 4.1; 2.2(h)"
core = false
extension = "generating-model"
given = { subject = "manifest", group = "c07.R3-release", conditions = ["written while the build runs"] }
record = "the artifact's row and the rows reached from it through built_from"
route = "follow built_from from the artifact's row, row by row, down to the rows of source files"
rule = "contains: the walk reaches the file of a member the request names. does not contain: the artifact has a row and the walk reaches no such file. no record: the artifact has no row. A name with no row of its own ends its branch, and the manifest has no check that reports it. Only the answer is compared; the list of unresolved records is not read: the manifest holds nothing below a file."
marks = []
excluded_from_tally = false
needs_ordinal = false
source = "hand-written table: as each row of the group names it"
expect = { one_of = ["right", "wrong"], right = "the reading equals the outcome of the listed row: \"contains\", \"does not contain\", no record for \"not covered\", stopped for a row that expects an error", wrong = "the reading is an answer or a stop and it is not the outcome of the listed row; \"does not contain\" read from a gap is wrong like any other answer" }

