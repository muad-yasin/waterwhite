route = "the history is read from the trace: the checkpoint's segment up to its step, then the history of its parent checkpoint. Each trace row is tied to a token-index entry by the document's token range (tie). The entry's bit is read from the forget set made by the native by-sources call for the members the request names, on a fresh copy of each store"
rule = "contains: a tied entry's bit is 1. does not contain: the history has trace rows, at least one is tied to an entry, and no tied entry's bit is 1. no record: the trace does not hold the checkpoint, or holds no row for any step of its history. cannot answer: the tie is not valid (tie). A step with no trace row, an uncovered range and a trace row with no entry add nothing to the reading; neither half has a check that reports them. The trace read here is the one this tool writes when the runs are registered from the starting state of the listed row (c2.i to c2.iv); a segment for which that registration writes no trace has no row. Only the answer is compared; the named cause is not."
marks = ["step-to-ordinal part is the tool's own output"]
