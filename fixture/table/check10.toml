[[row]]
id = "c10.c01.E@9.dolma+trace"
question = "Under withdraw A, does checkpoint 9 keep \"contains\" while step 8 is untraced?"
plan = "5.5 Check 10; 5.5 Check 1"
core = true
given = { subject = "dolma+trace", group = "c01.E@9", conditions = ["sandbox", "relative paths", "row count checked", "the join's own position output"] }
record = "the trace's rows (segment, step, shard, ordinal) for the steps of the checkpoint's history, and for each the companion row of that document"
route = "the history is read from the trace: the checkpoint's segment up to its step, then the history of its parent checkpoint. Each trace row is tied to the companion row of its document (the two readings under ordinal), and the tied row's id is resolved to the file that holds it"
rule = "contains: a tied row's id resolves to the file of a member the request names. does not contain: the history has trace rows, every tied row's id resolves to a source file, and none is the file of such a member. no record: the trace does not hold the checkpoint, or holds no row for any step of its history. cannot answer: no tied row names such a member and a tied row's id resolves to a generation output or to no file. A step with no trace row, an uncovered range and a trace row with no companion row add nothing to the reading; neither half has a check that reports them. Only the answer is compared; the first exposure, the basis and the untraced steps of the listed row are not."
marks = ["step-to-ordinal part is the tool's own output"]
excluded_from_tally = true
needs_ordinal = true
source = "hand-written table: as each row of the group names it"
[row.expect]
one_of = [
    "right",
    "wrong",
    "cannot answer",
]
right = "the reading equals the outcome of the listed row: \"contains\", \"does not contain\", no record for \"not covered\", stopped for a row that expects an error"
wrong = "the reading is an answer or a stop and it is not the outcome of the listed row; \"does not contain\" read from a gap is wrong like any other answer"
cannot_answer = "a consumed document's row resolves to a generation output and the toolkit has no derived-from link that says what that record was made from; or the tie to an ordinal is not shown (ordinal)"
[row.ordinal]
selector = "document i is line i"
what_is_shown = "on the replica's chunk files, under the replica's settings (one preprocessing partition, or --keep-sequential-samples), the document with ordinal n of a shard (counted from 0) is line n + 1 of its chunk file (counted from 1)"
[row.ordinal.shown]
name = "tie by src and loc"
rule = "the document with ordinal n of a shard is tied to the companion row whose src is the shard's chunk file and whose loc is n + 1, never by the row's place in the companion file"
mark = "ordinal derived from src and loc (owner's ruling after the debate)"
grades = [
    "right",
    "wrong",
    "cannot answer",
]
[row.ordinal.not_shown]
name = "cannot answer"
rule = "the question is recorded as cannot answer"
evidence = "the missing tie: nothing shown ties a companion row to an ordinal of the replica's shard"
grades = ["cannot answer"]

[[row]]
id = "c10.c01.E@9.originblame+trace"
question = "Under withdraw A, does checkpoint 9 keep \"contains\" while step 8 is untraced?"
plan = "5.5 Check 10; 5.5 Check 1"
core = true
given = { subject = "originblame+trace", group = "c01.E@9", conditions = ["sandbox", "relative paths", "one process in packed order", "one revoke per fresh store", "the join's own position output"] }
record = "the trace's rows (segment, step, shard, ordinal) for the steps of the checkpoint's history, and for each the token-index entry of that document with its bit in the forget set"
route = "the history is read from the trace: the checkpoint's segment up to its step, then the history of its parent checkpoint. Each trace row is tied to a token-index entry by the document's token range (tie). The entry's bit is read from the forget set made by the native by-sources call for the members the request names, on a fresh copy of each store"
rule = "contains: a tied entry's bit is 1. does not contain: the history has trace rows, at least one is tied to an entry, and no tied entry's bit is 1. no record: the trace does not hold the checkpoint, or holds no row for any step of its history. cannot answer: the tie is not valid (tie). A step with no trace row, an uncovered range and a trace row with no entry add nothing to the reading; neither half has a check that reports them. Only the answer is compared; the first exposure, the basis and the untraced steps of the listed row are not."
marks = ["step-to-ordinal part is the tool's own output"]
excluded_from_tally = true
needs_ordinal = false
source = "hand-written table: as each row of the group names it"
[row.expect]
one_of = [
    "right",
    "wrong",
    "cannot answer",
]
right = "the reading equals the outcome of the listed row: \"contains\", \"does not contain\", no record for \"not covered\", stopped for a row that expects an error"
wrong = "the reading is an answer or a stop and it is not the outcome of the listed row; \"does not contain\" read from a gap is wrong like any other answer"
cannot_answer = "the tie by token range is not valid; the missing field is an id or an offset on the token-index entry"
[row.tie]
by = "the document's token range"
rule = "in the store that tracked a shard, entry k covers the tokens from the sum of the token counts of entries 0 to k-1 up to that sum plus its own count; the document with ordinal n covers the range the shard's own index file gives it; a document is tied to the entry whose range equals its own"
valid_when = "one process tracked the documents of the shard in packed order (ordinal order), and the run says so"
otherwise = "cannot answer; the missing field is an id or an offset on the token-index entry, which carries neither"

