# Check 2, the cache states (plan 5.5 Check 2). Written by hand before the tool exists.
# Conventions and the four starting states (c2.i to c2.iv): README.md.
#
# Each case registers the runs in a fresh store from its starting state. The
# request is "withdraw A". Cases (i) to (iii) withhold from runs E, D and Y alike.
# Run K appears in case (iv) only.
#
# The reason beside "data-order trace missing" is one of two (plan 3.5): "digest
# mismatch" for a replay whose digests differ from the recorded ones (case ii), and
# "no recorded digest" for a run with no recorded digest to compare a replay with
# (case iii).
#
# Every segment of runs E, D and Y is built over two or three shards, so each has
# all five kinds of index array: three per shard and two for the blend. A segment
# over one shard would have the three per-shard kinds and no blend arrays; the
# fixture has none.

# ---------------------------------------------------------------------------------
# (i) Cache files withheld, settings and seed kept
# ---------------------------------------------------------------------------------

[[row]]
id = "c02.i.arrays.E/seg-1"
question = "Are the index arrays replayed for E/seg-1 byte-identical to the withheld ones?"
plan = "5.5 Check 2 (i); 3.5 (replay); F3"
core = true
given = { state = "c2.i", segment = "E/seg-1" }
expect = { replayed_arrays = "byte-identical", kinds = ["document_index", "sample_index", "shuffle_index", "dataset_index", "dataset_sample_index"] }
expect_under = { F3 = { replayed_arrays = "bytes differ", replay = "rejected" } }
source = "the withheld files: the check compares them with the replayed arrays (on the .npy arrays, or with the replay run at the run's own paths)"

