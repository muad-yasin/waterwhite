plan = "5.5 Check 2 (ii); 3.5 (a replay counts only when its digests equal the recorded ones)"
core = true
given = { state = "c2.ii", segments = ["E/seg-1", "E/seg-2", "D/seg-1", "Y/seg-1"] }
expect = { digests = "differ from the recorded ones", replay = "rejected", reason = "digest mismatch" }
source = "hand-written table: a different seed gives different shuffles, so the replayed arrays cannot equal the recorded digests; the recorded digests are those of the run record the replica wrote, a source outside the tool"

