# The exact-rerun restart of Check 9: the first step at which the oracle's log of
# the corrected from-scratch run (same settings and seed, shard-3 without T, built
# from an empty cache folder) differs from the log of run E. Not a search
# condition: it is read off the two logs once the seeds are fixed.
#
# The corrected build is the replica's build of this spec with T left out
# (--leave-out T). Its shard-1 and shard-2 are the same bytes as before; its
# shard-3 holds 26 documents and 31 samples. Steps 1 to 6 give the same rows in
# both logs. Step 7 is the first that differs, at its first row: where run E reads
# the end of Z-088 (the first log line), the corrected run reads tokens 13 to 16
# of Z-077 (the second log line, from the corrected run's log). Every step from 7
# to 12 differs.
[positions.exact_rerun_restart]
conditions = []
fixed = { run = "E", not_before_step = 7 }
step = 7
steps_that_differ = [7, 8, 9, 10, 11, 12]
log_lines = [
    '{"segment": "E/seg-2", "step": 7, "sample_pos": 0, "global_index": 24, "rank": 0, "shard_position": 2, "ordinal": 24, "token_start": 32, "token_end": 39}',
