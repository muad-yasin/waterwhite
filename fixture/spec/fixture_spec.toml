# The fixture spec (plan 5.1): one text file, written by hand before the tool exists.
#
# It fixes what the hand-checked fixture is made of and how it is built. The
# pipeline replica reads it to build the fixture; the tests read it to know where
# each named record sits. Nothing in it is taken from the tool's output: the items
# marked "from the oracle" come from the replica and the oracle only.
#
# Id ranges are written "Z-001..Z-020" and mean every id from the first to the last.

format = "waterwhite.fixture-spec/1"

[megatron]
release_tag = "core_v0.20.0"          # plan F6
# Which package holds which code (plan F5), and the settled conditions of a run:
preprocessing = "tools/preprocess_data.py of a Megatron-LM checkout at the tag"
dataset_and_sampler = "megatron-core (megatron.core.datasets, megatron.training.datasets.data_samplers)"
partitions = 1                         # one partition, so document order is line order (F1)
workers = 1

[tokenizer]
type = "GPT2BPETokenizer"              # Megatron's tokenizer class (DECISIONS.md D-09)
name = "gpt2"
# The hub revision of the tokenizer files, and the two files every preprocessing
# run is handed, as paths relative to the Megatron environment folder (the folder
# WATERWHITE_MEGATRON_ENV names). The files are not committed (DECISIONS.md D-09).
revision = "607a30d783dfa663caf39e06633721c8d4cfcd7e"
vocab_file = "hf_home/hub/models--gpt2/snapshots/607a30d783dfa663caf39e06633721c8d4cfcd7e/vocab.json"
merges_file = "hf_home/hub/models--gpt2/snapshots/607a30d783dfa663caf39e06633721c8d4cfcd7e/merges.txt"
append_eod = true
# The end-of-document convention is recorded here from the oracle's output on this
# fixture before Check 3 runs (plan 3.3, F1). From the oracle: its F1 probe
# (docs/oracle.md, "F1 probe") on each of the six shards of the final build, the
# three of the partitioned layout and the three of the round-robin layout, reports
# one document per input line in input order, the end-of-document token 50256, and
# that every document's span in the index ends with that token
# ("eod": {"token_id": 50256, "in_span": true}, "f1_holds": true; in each shard
# every document equals its line followed by the token, and none equals its line
# alone).
eod_token_id = 50256
eod_in_span = true

[normaliser]
name = "control-chars/1"

[release_rows]
carry_source_id = false                # plan 5.8 B-3, Check 7; DECISIONS.md D-06

# ----------------------------------------------------------------------------------
# Sources (plan 5.1). One revision each, one member each.
# ----------------------------------------------------------------------------------

[sources.A]
file = "fixture/sources/A.jsonl"
member = "A/r1"
revision = "r1"
records = ["A-001", "A-002"]

[sources.B]
file = "fixture/sources/B.jsonl"
member = "B/r1"
revision = "r1"
records = ["B-001..B-013"]

[sources.C]
file = "fixture/sources/C.jsonl"
member = "C/r1"
revision = "r1"
records = ["C-001..C-004"]

[sources.Z]
file = "fixture/sources/Z.jsonl"
member = "Z/r1"
revision = "r1"
records = ["Z-001..Z-090"]

# Named records. A-001 and B-001 hold the same whole English passage X.
[handles]
"X@A" = "A-001"
"X@B" = "B-001"
SA = "A-002"                           # the passage of A that the summary S is made from
SC = "C-001"                           # the passage of C that the summary S is made from
P = "P"                                # English paraphrase of A's copy of X
T = "T"                                # German translation of P
S = "S"                                # summary of SA and SC, parent mode "all"

# ----------------------------------------------------------------------------------
# Generation (plan 5.1): fixed outputs, no model call, run in the closed-input harness.
# ----------------------------------------------------------------------------------

[generation]
file = "fixture/sources/generation.jsonl"
# Each row: {"id", "job", "handed": [ids], "used": [ids], "text"}.
# P: job "paraphrase", handed and used A-001 (read from the source revision, before dedup).
# T: job "translation", handed and used P.
# S: job "summary", handed and used A-002 and C-001.
model = "none"

# ----------------------------------------------------------------------------------
# Releases (plan 5.1)
# ----------------------------------------------------------------------------------

[releases.R1]
inputs = ["A-001", "B-001", "P", "T", "S", "Z-001..Z-020"]
dedup = true                           # exact dedup on the normalised text
dedup_winner = "A"                     # the copy of an identical text that is kept

[releases.R1-swap]                     # Check 7: the winner swapped, every text byte unchanged
inputs = ["A-001", "B-001", "P", "T", "S", "Z-001..Z-020"]
dedup = true
dedup_winner = "B"

[releases.R2]
inputs = ["B-001..B-013", "Z-021..Z-040"]
dedup = true
dedup_winner = "A"

[imports."import/T"]                   # the text-only legacy import of T (Check 6)
records = ["T"]
file_family = "A/r1"                   # the known file family: the file derives from this member
evidence = "file family: translations made from source A"

# ----------------------------------------------------------------------------------
# Release R3 (plan 5.1; the generating-model extension). It exists only when the
# generating-model extension is on, and it belongs to the fixture and to none of the
# generated sets. It is NOT a [releases.*] table and its rows are NOT in [generation]:
# the replica's loader reads those two for the core build and R3 must change nothing of
# it (no gen file of any generating store, no manifest, no count). This table is read
# only by the build of R3 (the store key "main+generating-model") and by the table's
# rows c05.g.model-entry-removed.on.* and c07.R3.*.
# Each row of the file: {"id", "job", "handed", "used", "model", "text"}. A job runs in
# the closed-input harness (the confined one) and is handed the text of its record, so the
# registration compares it and the log is stored compared. The model is the identifier the
# job's client reports. G6 and G9 name the checkpoints E@6 and E@9 of run E (the stub of a
# checkpoint is the checkpoint, plan 5.3); GU names a model the store was never told of;
# for GM the harness wrote the entry and the build removes it from the log it registers
# (the registered log has model None), so the file's "model" of GM is what the harness
# wrote and is not what the store holds.
# ----------------------------------------------------------------------------------

[extension_releases.R3]
extension = "generating-model"
file = "fixture/sources/generation_r3.jsonl"
inputs = ["Z-041", "Z-042", "Z-043", "Z-044"]    # one unrelated record of Z for each job
records = ["G6", "G9", "GU", "GM"]
registered_checkpoints = ["E@6", "E@9"]            # the models of G6 and G9
never_registered = ["hosted-model-x"]              # the model of GU
model_entry_removed = ["GM"]                       # the log registered for GM has no model entry

# ----------------------------------------------------------------------------------
# Run E and its shards (plan 5.1). Positions are fixed by the seed search against
# the oracle's log; the search may change the seeds below and may enlarge shard-3
# with unrelated records of Z. What it settled is written here by hand, with the
# oracle log lines that show each position (the [positions] tables at the end).
# The search found seeds on the build with the two shuffle seeds below, so they
# stayed as they were and shard-3 was not enlarged.
# ----------------------------------------------------------------------------------

# The records the shards of run E are built from, by shard, in the partitioned
# layout (plan 5.2): shards 1 and 2 hold unrelated records and B's records only,
# shard 3 holds T and unrelated records.
[layouts.partitioned]
shuffle_seed = 0                       # the build the seed search ran on
[layouts.partitioned.shards]
"shard-1" = ["B-001..B-006", "Z-041..Z-052"]
"shard-2" = ["B-007..B-013", "Z-053..Z-064"]
"shard-3" = ["T", "Z-065..Z-090"]

# The round-robin variant of run E for Check 1: the same records, dealt over three
# chunks after one shuffle of the whole list.
[layouts.round-robin]
chunks = 3
shuffle_seed = 0                       # the build the seed search ran on

# The skipped sanitizer line of run E (plan 5.1, Checks 1 and 5). One line that is
# not valid JSON is written into the file the sanitizer reads for shard-2, after the
# shuffle, as line 6 (counted from 1). The sanitizer skips it and logs the skip; it
# is a drop and shifts no ordinal, so shard-2 still holds 19 documents. The same
# line sits at the same place in chunk 2 of the round-robin variant. The line
# belongs to no source and is never ingested.
[sanitizer_skip]
shard = "shard-2"
line = 6
text = '{"id": "skip-1", "text": "this line is cut off'
layouts = ["partitioned", "round-robin"]

# Settings every run of the fixture shares (plan 3.1, run segment; 3.5).
[runs_common]
add_extra_token_to_sequence = true     # a sample spans sequence_length + 1 tokens
split = "1,0,0"                        # every document is in the training split
megatron_bridge = "none"               # no run is trained through Megatron-Bridge
sampler_class_single = "megatron.training.datasets.data_samplers.MegatronPretrainingSampler"
sampler_class_cyclic = "megatron.training.datasets.data_samplers.MegatronPretrainingRandomSampler"
caches_kept = true                     # every run keeps its data-order cache folder

# Mixture names (docs/interfaces.md 9.2). The list is the trainer's order: the
# position of a shard in the list is its dataset number in the blend (plan 3.5).
[mixtures]
"E/mix-1" = ["shard-1", "shard-2"]
"E/mix-2" = ["shard-1", "shard-2", "shard-3"]
"D/mix-1" = ["shard-1", "shard-2"]
"Y/mix-1" = ["shard-1", "shard-2", "shard-3"]
"K/mix-1" = ["shard-3", "shard-2"]     # on purpose not in name order, see [runs.K]
"E-rr/mix-1" = ["E-rr/shard-1", "E-rr/shard-2"]
"E-rr/mix-2" = ["E-rr/shard-1", "E-rr/shard-2", "E-rr/shard-3"]

[runs.E]
sequence_length = 32
global_batch_size = 4
micro_batch_size = 4
data_parallel_size = 1
dataloader_type = "single"
random_seed = 578                      # from the seed search: the smallest seed under which conditions 1 to 12, 16 and 17 hold
steps = 12
checkpoints = [6, 9]

[runs.E.segments."E/seg-1"]
steps = [1, 6]
shards = ["shard-1", "shard-2"]
start_kind = "fresh"
mixture = "E/mix-1"
train_iters = 6                        # the blend is asked for 6 x 4 = 24 samples
consumed_at_start = 0

[runs.E.segments."E/seg-2"]
steps = [7, 12]
shards = ["shard-1", "shard-2", "shard-3"]
start_kind = "resume"
parent_checkpoint = "E@6"
mixture = "E/mix-2"
train_iters = 12                       # a new blend, asked for 12 x 4 = 48 samples
consumed_at_start = 24                 # the counter saved with E@6; steps 7..12 read 24..47

# The operator's step record of run E (plan 3.1, 3.5, 5.1; docs/interfaces.md 8.2).
# Step 8 is lowered to half of its last sample. The rule for the cut:
#   - the last sample of step 8 is the sample at sample_pos 3 (the fourth the step reads);
#   - last_sample_tokens_read = sequence_length / 2 = 16;
#   - so the trace of step 8 covers 16 of that sample's 33 tokens, and the uncovered
#     range is tokens 16 to 33 of the sample (half-open, counted from 0 inside the sample);
#   - the rows of the first 16 tokens stay; the row that holds the sample's 17th token
#     is cut so that it ends there; no row after it is written;
#   - the sample is still counted: the trace of step 8 counts 4 samples.
# Where the cut falls in document terms (shard, ordinal, token) is read from the
# oracle's log lines of that sample and written under [positions.step8_cut].
[runs.E.step_record."E/seg-2"]
steps = [ { step = 8, batch_size = 4, last_sample_tokens_read = 16 } ]
checkpoints = [ { name = "E@9", step = 9 } ]
[runs.E.step_record."E/seg-1"]
steps = []
checkpoints = [ { name = "E@6", step = 6 } ]

# The round-robin variant of run E (Check 1): the same records, settings and seed.
# No step record lowers a sample, so every step is fully traced.
#
# Its second segment is a resume, and a resume starts from a checkpoint. So the
# variant registers one checkpoint, E-rr@6, after step 6: it is named in the step
# record of E-rr/seg-1 and is the parent of E-rr/seg-2 (DECISIONS.md D-24). It is
# there to tie the two segments together and for nothing else: the plan tabulates
# no checkpoint answer on this layout (4.5), so the hand-written table has no row
# that asks E-rr@6 anything, and no search condition places a read before or
# after it.
[runs.E-rr]
same_settings_as = "E"
layout = "round-robin"
checkpoints = [6]
[runs.E-rr.segments."E-rr/seg-1"]
steps = [1, 6]
shards = ["E-rr/shard-1", "E-rr/shard-2"]
start_kind = "fresh"
mixture = "E-rr/mix-1"
train_iters = 6
consumed_at_start = 0
[runs.E-rr.segments."E-rr/seg-2"]
steps = [7, 12]
shards = ["E-rr/shard-1", "E-rr/shard-2", "E-rr/shard-3"]
start_kind = "resume"
parent_checkpoint = "E-rr@6"
mixture = "E-rr/mix-2"
train_iters = 12
# The counter saved with E-rr@6:
consumed_at_start = 24

[runs.E-rr.step_record."E-rr/seg-1"]
steps = []
checkpoints = [ { name = "E-rr@6", step = 6 } ]
[runs.E-rr.step_record."E-rr/seg-2"]
steps = []
checkpoints = []

# ----------------------------------------------------------------------------------
# Descendant D (plan 5.1): three steps from the step-9 checkpoint on shards 1 and 2
# only. It is a warm start: the trainer restarts the step count and the
# consumed-sample counter at 0 (plan F4), so its steps are 1 to 3, it reads samples
# 0 to 11 of its own blend, and its checkpoint is D@3.
# ----------------------------------------------------------------------------------

[runs.D]
sequence_length = 32
global_batch_size = 4
micro_batch_size = 4
data_parallel_size = 1
dataloader_type = "single"
random_seed = 0                        # from the seed search: the smallest seed under which condition 13 holds
steps = 3
checkpoints = [3]

[runs.D.segments."D/seg-1"]
steps = [1, 3]
shards = ["shard-1", "shard-2"]
start_kind = "warm-start"
parent_checkpoint = "E@9"
mixture = "D/mix-1"
train_iters = 3
consumed_at_start = 0

[runs.D.step_record."D/seg-1"]
steps = []
checkpoints = [ { name = "D@3", step = 3 } ]

# ----------------------------------------------------------------------------------
# Branch Y (plan 5.1): six steps from the step-6 checkpoint on shards 1, 2 and 3, so
# its mixture holds T. A warm start like D: steps 1 to 6, samples 0 to 23 of its own
# blend, checkpoint Y@6. The seed search fixes a seed under which no step reads T.
# ----------------------------------------------------------------------------------

[runs.Y]
sequence_length = 32
global_batch_size = 4
micro_batch_size = 4
data_parallel_size = 1
dataloader_type = "single"
random_seed = 0                        # from the seed search: the smallest seed under which conditions 14 and 15 hold
steps = 6
checkpoints = [6]

[runs.Y.segments."Y/seg-1"]
steps = [1, 6]
shards = ["shard-1", "shard-2", "shard-3"]
start_kind = "warm-start"
parent_checkpoint = "E@6"
mixture = "Y/mix-1"
train_iters = 6
consumed_at_start = 0

[runs.Y.step_record."Y/seg-1"]
steps = []
checkpoints = [ { name = "Y@6", step = 6 } ]

# ----------------------------------------------------------------------------------
# Run K, the cyclic run (plan 5.1; 3.5; Checks 1, 2 (iv) and 8).
#
# Properties the plan fixes: the cyclic sampler, data sharding on, a data-parallel
# size of 2, a warm start from E@6 that restarts the consumed-sample counter, at
# least one epoch boundary crossed, one resume inside an epoch, seeded, cache files
# and run record (with the shuffle digests) kept.
#
# What this spec sets, and why:
# - Shards: shard-3 and shard-2, handed to the trainer in that order. Two shards
#   make a real blend, and only a blend has as its length the smaller of the
#   samples asked for and the samples the shards hold (plan 3.5, input 2); a single
#   shard is built to the length asked for and its epoch never ends inside the run.
#   The list is not in name order, as an unsorted listing gives it (plan 3.3, Mixture
#   selection): dataset 0 of the blend is shard-3 and dataset 1 is shard-2. The
#   mixture holds T.
# - Batch: micro batch 2 on 2 ranks, global batch 4. Each step reads 2 samples per
#   rank. One epoch is N div 4 steps, N being the length of the blend.
# - Steps: 40, so the run asks for 160 samples. It crosses an epoch boundary only
#   if the two shards hold fewer than that (search condition 19).
# - Launches: both launches run with train_iters = 40, so they build the same
#   blend. Launch 0 stops after step 3 and writes K@3. Launch 1 resumes from K@3
#   with the counter at 12, inside epoch 0, and runs to step 40.
# - Checkpoints: K@3 (before the resume; the resume starts from it), K@8 (after the
#   resume, inside epoch 0) and K@40 (after the first epoch boundary).
# - Answers under "withdraw A" (the table, Check 8): K@3 "does not contain", K@8
#   and K@40 "contains". Search conditions 22 and 23 place the first read of T at
#   step 7 or 8 and on rank 1. With that placement a join that keeps the counter of
#   E@6 (24) instead of restarting it sees T inside steps 1 to 3, a join that
#   restarts the epoch's order at the resume sees no T up to step 8, and a join
#   that builds rank 0 only sees no T up to step 8: each gets a wrong answer.
# ----------------------------------------------------------------------------------

[runs.K]
sequence_length = 32
global_batch_size = 4
micro_batch_size = 2
data_parallel_size = 2
world_size = 2
dataloader_type = "cyclic"
data_sharding = true
random_seed = 4                        # from the seed search: the smallest seed under which conditions 18 to 23 hold
steps = 40                             # confirmed under search condition 19: the blend holds 57 samples, an epoch of 14 steps
checkpoints = [3, 8, 40]

[runs.K.segments."K/seg-1"]
steps = [1, 40]
shards = ["shard-3", "shard-2"]
start_kind = "warm-start"
parent_checkpoint = "E@6"
mixture = "K/mix-1"
train_iters = 40                       # both launches
consumed_at_start = 0                  # restarted; E@6 was saved with 24
launches = [
    { position = 0, world_size = 2, data_parallel_size = 2, consumed_at_start = 0, step_at_start = 0, first_step = 1, last_step = 3 },
    { position = 1, world_size = 2, data_parallel_size = 2, consumed_at_start = 12, step_at_start = 3, first_step = 4, last_step = 40 },
]
resume_from = "K@3"

[runs.K.step_record."K/seg-1"]
steps = []
checkpoints = [ { name = "K@3", step = 3 }, { name = "K@8", step = 8 }, { name = "K@40", step = 40 } ]

# ----------------------------------------------------------------------------------
# The seed search (plan 5.1): every read position the fixture states is fixed by a
# search over candidate seeds against the oracle's log. Nothing is argued from the
# shards' sizes. The search may change: layouts.partitioned.shuffle_seed,
# layouts.round-robin.shuffle_seed and the random_seed of runs E, D, Y and K. If no
# tried seed gives all the positions, shard-3 is enlarged with unrelated records of
# Z and the search repeats (plan 5.1).
#
# Words used below. "The log" of a run is the oracle's log of that run
# (docs/interfaces.md 8.3) in the partitioned layout unless a condition says
# otherwise. A "row" is one log line. A sample "holds" a document when one of its
# rows names the document's shard position and ordinal. W is the shared-token
# document of condition 12. Shard positions in run E: 0 is shard-1, 1 is shard-2,
# 2 is shard-3. In run K: 0 is shard-3, 1 is shard-2.
#
# Each condition is one sentence a script can check on the logs and the replica's
# manifests. "decides" names what in the table rests on it.
#
# Two things the conditions rest on (DECISIONS.md D-24):
# - T is short: 22 tokens with its end-of-document token, against a sample of 33.
#   Run E reads it whole, inside one sample, as that sample's second document
#   (condition 4). Runs Y and K pack shard-3 under seeds of their own, so there T
#   may lie across two samples; conditions 14, 22 and 23 speak of every row that
#   names T, whatever its token range.
# - W is an unrelated record of Z in shard-3 (condition 12). It cannot be a record
#   of shard-1 or shard-2: segment 2 packs those shards with the seed segment 1
#   used, and the samples of them that steps 7 to 9 read are samples steps 1 to 6
#   read before, so no record there is read for the first time between checkpoints
#   6 and 9. Shard-3 enters with segment 2, so a record of it can be.
#
# The result of the search (docs/oracle.md, "Seed search"), on the build with both
# layout shuffle seeds 0: run E was searched from seed 0 upwards and 578 is the
# first seed under which conditions 1 to 12 hold, and 16 and 17 hold with it on the
# round-robin variant; of the 579 candidates, condition 4 held for 8 and condition
# 12 for 40. Runs D and Y: seed 0. Run K: seed 4, the first of 5 candidates.
# ----------------------------------------------------------------------------------

[search]
may_change = [
    "layouts.partitioned.shuffle_seed",
    "layouts.round-robin.shuffle_seed",
    "runs.E.random_seed",
    "runs.D.random_seed",
    "runs.Y.random_seed",
    "runs.K.random_seed",
]
if_no_seed_fits = "enlarge shard-3 with unrelated records of Z and repeat (plan 5.1)"

[[search.condition]]
n = 1
id = "sizes.E"
sentence = "The log of E/seg-1 holds exactly 24 samples in steps 1 to 6 with global indices 0 to 23, and the log of E/seg-2 holds exactly 24 samples in steps 7 to 12 with global indices 24 to 47, four samples in every step."
plan = "5.1 (12 steps, global batch 4, two segments); 2.2(e); F4"
decides = "every step of run E has a complete batch, so no row of the table rests on a short step"

[[search.condition]]
n = 2
id = "skipped-line.no-shift"
sentence = "Shard-2 holds exactly 19 documents, ordinals 0 to 18, and the sanitizer's log lists exactly one skipped line for its input, line 6."
plan = "5.1 (a skipped sanitizer line); 3.3 (position mode); F1"
decides = "c01.E.skipped-line; the target of fault f.label (the shard with one skipped line)"

[[search.condition]]
n = 3
id = "skipped-line.read"
sentence = "Some step of run E has a row that names a document of shard-2 whose line in the sanitizer's input comes after line 6."
plan = "5.5 Check 1 (the diff includes the skipped line)"
decides = "c01.E.skipped-line"

[[search.condition]]
n = 4
id = "T.step-7"
sentence = "At step 7 of E/seg-2 one sample holds T whole as its second document: the sample's first row is the end of another document of shard-3, an unrelated record of Z; its second row is T's document from token 0 to token 22, all of T (21 tokens and the end-of-document token); and a third row follows in the same sample, so no token of T lies in another sample. T has no other row in the log of run E, so none in steps 1 to 6. Step 7 is fully traced, since the step record lowers step 8 only."
plan = "5.1 (T is read as the second document of a packed sample at step 7, with no earlier exposure; the sample that holds T is fully traced); 5.5 Check 8; DECISIONS.md D-24 (T fits whole inside one packed sample)"
decides = "E@9 and D@3 answer \"contains\" with first exposure at step 7 of E/seg-2 (c08.withdraw-A.E@9, c08.withdraw-A.D@3); c01.E.T; the neighbours of T in its sample, which the extension row c07.ban.scope reads from positions.T"

[[search.condition]]
n = 5
id = "T.no-earlier-exposure"
sentence = "No row of steps 1 to 6 of run E names shard position 2, so segment 1 reads no affected record."
plan = "5.1 (no earlier exposure); 5.5 Check 8 (checkpoint 6)"
decides = "E@6 answers \"does not contain\" (c08.withdraw-A.E@6); and, W being a document of shard-3, E@6 answers \"does not contain\" for the request that names W alone (c08.shared-token.E@6)"

[[search.condition]]
n = 6
id = "T.not-in-step-8-last-sample"
sentence = "The last sample of step 8 of run E (sample_pos 3) has no row that names T."
plan = "5.1 (the sample that holds T, at step 7, is fully traced); 5.5 Check 8 (the half-covered sample changes neither answer)"
decides = "the uncovered range of step 8 holds no token of T; E@9 and D@3 rest on step 7 alone"

[[search.condition]]
n = 7
id = "step-8.cut-inside-a-row"
sentence = "In the last sample of step 8 of run E the sample's 17th token is not the first token of a row, so the cut after 16 tokens falls inside a row."
plan = "5.5 Check 1 (first half equal to the oracle's rows, second half an uncovered range starting at the cut position)"
decides = "c01.E.step8.first-half, c01.E.step8.uncovered; positions.step8_cut"

[[search.condition]]
n = 8
id = "repeated-draw"
sentence = "Some document of shard-1 or shard-2 has a row in a step from 1 to 6 and a row in a step from 7 to 12 of run E."
plan = "5.1 (a repeated draw: a record read again in segment 2, whose mixture is a new blend)"
decides = "c01.E.repeated-draw"

[[search.condition]]
n = 9
id = "shared-ordinal"
sentence = "Some ordinal has rows from two different shard positions in the log of run E."
plan = "5.1 (the same ordinal in two shards)"
decides = "c01.E.shared-ordinal"

[[search.condition]]
n = 10
id = "split-document"
sentence = "Some document other than T and W has rows in two different samples of run E, each row at least two tokens long, and one of the two rows begins with the last token the other one read."
plan = "5.1 (a document split across two packed samples); Decision 18; 5.5 Check 1"
decides = "c01.E.split-document"

[[search.condition]]
n = 11
id = "seg-1.reads-both-shards"
sentence = "Steps 1 to 6 of run E have at least one row on shard position 0 and at least one row on shard position 1."
plan = "5.5 Check 5 (a fault in a shard's map reaches every checkpoint whose steps read the shard); 2.4"
decides = "E@6, Y@6 and K@3 under the faults f.map-deleted and f.label"

[[search.condition]]
n = 12
id = "shared-token"
sentence = "A document W of shard-3, an unrelated record of Z, has exactly one row in steps 1 to 9 of run E: the last row of a sample of step 7, 8 or 9 that is neither the last sample of step 8 nor the sample that holds T, covering W's tokens 0 to 1 only. Steps 1 to 6 read no document of shard-3 (condition 5), so that row is the first read of W."
plan = "5.1 (a document read only through the shared last token of a sample); 3.5; Decision 18; 2.4 (a row inside the covered part of a sample); DECISIONS.md D-13 as amended by D-24 (W is an unrelated record of Z in shard-3: no record of shard-1 or shard-2 is read for the first time between checkpoints 6 and 9)"
decides = "the checkpoint before that step is E@6 and answers \"does not contain\" for the request that names W alone; the checkpoint after it is E@9 and answers \"contains\", and D@3 with it (c08.shared-token.*); c01.E.shared-token"

[[search.condition]]
n = 13
id = "D.reads"
sentence = "The log of run D holds exactly 12 samples in steps 1 to 3 with global indices 0 to 11, and every row is on shard position 0 or 1."
plan = "5.1 (D: three steps from the step-9 checkpoint on shards 1 and 2 only; D's reads); F4"
decides = "D's steps are traced and read no shard-3 document; D@3 answers \"contains\" through E@9 only"

[[search.condition]]
n = 14
id = "Y.never-reads-T"
sentence = "The log of run Y holds exactly 24 samples in steps 1 to 6 with global indices 0 to 23, and no row names T."
plan = "5.1 (none of Y's six steps reads T); 5.5 Check 8 (branch Y)"
decides = "Y@6 answers \"does not contain\" although Y/mix-1 answers \"contains\" (c08.withdraw-A.Y@6)"

[[search.condition]]
n = 15
id = "Y.reads-shard-3"
sentence = "At least one row of run Y is on shard position 2."
plan = "5.5 Check 5 (the corrupted digest); 3.4"
decides = "Y@6 under the fault f.digest: its steps read documents of the shard whose map digest is corrupted"

[[search.condition]]
n = 16
id = "round-robin.T-in-chunk-3"
sentence = "In the round-robin layout the replica's manifest of chunk 3 holds T, and the manifests of chunks 1 and 2 hold no record derived from A."
plan = "5.2 (three chunks for the round-robin variant of run E); 4.5; 5.5 Check 1"
decides = "E-rr/shard-3 and E-rr/mix-2 answer \"contains\"; E-rr/shard-1, E-rr/shard-2 and E-rr/mix-1 answer \"does not contain\" (c05.unmutated.E-rr/*)"

[[search.condition]]
n = 17
id = "round-robin.fully-traced"
sentence = "The log of run E in the round-robin layout holds exactly 24 samples in steps 1 to 6 and 24 in steps 7 to 12, and the run is registered with no step record that lowers a sample."
plan = "5.5 Check 1 (the same records, settings and seed, every step fully traced)"
decides = "c01.E-rr.diff, c01.E-rr.fully-traced"

[[search.condition]]
n = 18
id = "K.launches"
sentence = "The log of run K holds exactly 160 samples in steps 1 to 40, two of rank 0 and two of rank 1 in every step; steps 1 to 3 are read from a consumed-sample counter of 0 and steps 4 to 40 from a counter of 12."
plan = "5.1 (run K: warm start that restarts the counter, one resume inside an epoch, data-parallel size 2); F4; 3.5"
decides = "c01.K.warm-start, c01.K.resume, c01.K.ranks"

[[search.condition]]
n = 19
id = "K.epoch-boundary"
sentence = "The length N of run K's blend, as the oracle's dataset reports it, gives an epoch of N div 4 steps that is at least 9 and at most 36 steps long."
plan = "5.1 (run K crosses at least one epoch boundary and is resumed inside an epoch); 3.5 (input 2: the dataset length)"
decides = "steps 1 to 8 and the resume lie inside epoch 0 and K@40 lies after the first boundary. This rests on the shards' sizes, not on a seed: if the epoch is longer than 36 steps, runs.K.steps is raised by hand to the next multiple of 4 above N div 4 plus 4, and the last checkpoint and its rows are renamed; if it is shorter than 9 steps, the K rows of the table are rewritten before use"

[[search.condition]]
n = 20
id = "K.epoch-order"
sentence = "The step after step N div 4 of run K is read in the order of epoch 1, and run K's run record holds a shuffle digest for every (launch, epoch, rank) the run reads in."
plan = "3.5 (the order of a cyclic run); 5.5 Check 1 (run K across its epoch boundary); Check 8"
decides = "c01.K.epoch-boundary; c08.K.digests-match"

[[search.condition]]
n = 21
id = "K.reads-shard-3-early"
sentence = "Steps 1 to 3 of run K have at least one row on shard position 0 (shard-3)."
plan = "5.5 Check 5 (the corrupted digest); 3.4"
decides = "K@3 under the fault f.digest"

[[search.condition]]
n = 22
id = "K.first-read-of-T"
sentence = "The first step of run K with a row that names T is step 7 or step 8."
plan = "5.1 (run K's read positions are fixed by the same seed search); 5.5 Check 8 (run K's checkpoints answer as the table lists them); F4"
decides = "K@3 answers \"does not contain\"; K@8 and K@40 answer \"contains\" with first exposure at that step (c08.withdraw-A.K@*)"

[[search.condition]]
n = 23
id = "K.T-on-rank-1"
sentence = "In steps 1 to 8 of run K every row that names T has rank 1."
plan = "5.1 (a data-parallel size of 2 or more); 3.5 (each rank reads its own bucket); 5.5 Check 1 (one sampler per rank)"
decides = "K@8 answers \"contains\" only if the join builds rank 1's order"

# ----------------------------------------------------------------------------------
# From the oracle (written by hand after the seed search).
#
# Everything from here to [pending] was read off the oracle's output on the build
# of this spec: the logs of the fixture runs (docs/oracle.md, "Fixture runs"), the
# check of the conditions on them (seed_search.py --check-runs), the F1 probe, and
# the replica's manifests. Nothing comes from the tool.
#
# Each table under [positions] names the search conditions it rests on, what the
# plan fixed beforehand ("fixed"), the values the logs gave, and "log_lines": the
# lines themselves, each copied from the log as the log holds it. An ordinal is a
# document number inside its shard; "record" is the id of the tokenizer-input line
# with that number (line ordinal + 1 of the shard's input, by the replica's
# manifest).
# ----------------------------------------------------------------------------------

# Sizes, as the replica's index check, the F1 probe and the oracle's dataset
# objects report them. A sample is 33 tokens (sequence_length + 1). "tokens"
# counts the end-of-document token of every document.
[sizes]
tokens_of_X = 16                       # A-001 and B-001: 15 tokens and the end-of-document token; B-001 is 16 in shard-1's index
tokens_of_P = 15                       # P is in no shard: counted with the same GPT-2 tokenizer, plus the end-of-document token
tokens_of_T = 22                       # 21 tokens and the end-of-document token; 22 in shard-3's index
[sizes.shards]
"shard-1" = { documents = 18, tokens = 798, samples = 24 }
"shard-2" = { documents = 19, tokens = 827, samples = 25 }
"shard-3" = { documents = 27, tokens = 1044, samples = 32 }
"E-rr/shard-1" = { documents = 22, tokens = 951, samples = 29 }
"E-rr/shard-2" = { documents = 21, tokens = 874, samples = 27 }
"E-rr/shard-3" = { documents = 21, tokens = 844, samples = 26 }
# The length of the dataset each segment's sampler runs over: the blend's, the
# smaller of the samples asked for and the samples its shards hold (plan 3.5).
[sizes.dataset_length]
"E/seg-1" = 24
"E/seg-2" = 48
"E-rr/seg-1" = 24
"E-rr/seg-2" = 48
"D/seg-1" = 12
"Y/seg-1" = 24
"K/seg-1" = 57

# T in run E (conditions 4, 5 and 6). The first sample of step 7 (global index 24
# of the blend of E/seg-2) reads three documents of shard-3: the last 7 tokens of
# Z-088 (document 24, tokens 32 to 39), then T whole (document 7, tokens 0 to 22),
# then the first 4 tokens of Z-067 (document 26); 7 + 22 + 4 = 33. No other row of
# run E names T, and none of the 41 rows of steps 1 to 6 is on shard position 2.
[positions.T]
conditions = [4, 5, 6]
fixed = { segment = "E/seg-2", step = 7, row_in_sample = 2, token_start = 0, token_end = 22 }
record = "T"
sample_pos = 0
global_index = 24
shard_position = 2
ordinal = 7
token_end = 22
rows_in_sample = 3
first_row = { record = "Z-088", shard_position = 2, ordinal = 24, token_start = 32, token_end = 39 }
neighbours = [
    { record = "Z-088", shard_position = 2, ordinal = 24, token_start = 32, token_end = 39 },
    { record = "Z-067", shard_position = 2, ordinal = 26, token_start = 0, token_end = 4 },
]
rows_of_T_in_run_E = [ { segment = "E/seg-2", step = 7, sample_pos = 0, token_start = 0, token_end = 22 } ]
rows_in_steps_1_to_6 = 41
rows_in_steps_1_to_6_on_shard_position_2 = 0
log_lines = [
    '{"segment": "E/seg-2", "step": 7, "sample_pos": 0, "global_index": 24, "rank": 0, "shard_position": 2, "ordinal": 24, "token_start": 32, "token_end": 39}',
    '{"segment": "E/seg-2", "step": 7, "sample_pos": 0, "global_index": 24, "rank": 0, "shard_position": 2, "ordinal": 7, "token_start": 0, "token_end": 22}',
    '{"segment": "E/seg-2", "step": 7, "sample_pos": 0, "global_index": 24, "rank": 0, "shard_position": 2, "ordinal": 26, "token_start": 0, "token_end": 4}',
]

# The skipped sanitizer line (conditions 2 and 3). Shard-2 holds 19 documents and
# the sanitizer's log lists one skipped line for it, line 6 of its input. The
# first sample of step 1 reads document 17 of shard-2, Z-063, which was line 19 of
# the sanitizer's input: the 18th line it kept, one place behind because of the
# skipped line.
[positions.skipped_line]
conditions = [2, 3]
fixed = { shard = "shard-2", line = 6, documents = 19 }
skipped_lines_logged = [6]
segment = "E/seg-1"
step = 1
sample_pos = 0
shard_position = 1
ordinal = 17
record = "Z-063"
sanitizer_input_line = 19
log_lines = [
    '{"segment": "E/seg-1", "step": 1, "sample_pos": 0, "global_index": 0, "rank": 0, "shard_position": 1, "ordinal": 17, "token_start": 21, "token_end": 50}',
]

# The cut of step 8 (conditions 6 and 7). The last sample of step 8 (sample_pos 3,
# global index 31) reads tokens 19 to 44 of Z-080 (document 2 of shard-3, 25
# tokens) and tokens 0 to 8 of Z-085 (document 23). The step record covers its
# first 16 tokens: tokens 19 to 35 of Z-080. The uncovered range starts at token
# 35 of that document, inside the first row, and runs to the sample's end. Neither
# document is T.
[positions.step8_cut]
conditions = [6, 7]
fixed = { segment = "E/seg-2", step = 8, sample_pos = 3, covered_tokens = 16, sample_tokens = 33 }
global_index = 31
shard_position = 2
ordinal = 2
record = "Z-080"
token = 35                             # the document token at which the uncovered range starts
uncovered_in_sample = [16, 33]
rows_of_the_covered_part = [ { shard_position = 2, ordinal = 2, token_start = 19, token_end = 35 } ]
records_of_the_last_sample_of_step_8 = ["Z-080", "Z-085"]
log_lines = [
    '{"segment": "E/seg-2", "step": 8, "sample_pos": 3, "global_index": 31, "rank": 0, "shard_position": 2, "ordinal": 2, "token_start": 19, "token_end": 44}',
    '{"segment": "E/seg-2", "step": 8, "sample_pos": 3, "global_index": 31, "rank": 0, "shard_position": 2, "ordinal": 23, "token_start": 0, "token_end": 8}',
]

# The repeated draw (condition 8). Tokens 10 to 43 of Z-051 (document 0 of
# shard-1) are a whole sample. Segment 1 reads it as the last sample of step 6 and
# segment 2, whose mixture is a new blend, reads the same tokens again at step 10.
[positions.repeated_draw]
conditions = [8]
shard_position = 0
ordinal = 0
record = "Z-051"
first_read = { segment = "E/seg-1", step = 6, sample_pos = 3, token_start = 10, token_end = 43 }
second_read = { segment = "E/seg-2", step = 10, sample_pos = 2, token_start = 10, token_end = 43 }
same_range_read_again = true
log_lines = [
    '{"segment": "E/seg-1", "step": 6, "sample_pos": 3, "global_index": 23, "rank": 0, "shard_position": 0, "ordinal": 0, "token_start": 10, "token_end": 43}',
    '{"segment": "E/seg-2", "step": 10, "sample_pos": 2, "global_index": 38, "rank": 0, "shard_position": 0, "ordinal": 0, "token_start": 10, "token_end": 43}',
]

# The same ordinal in two shards (condition 9). Document 1 is Z-048 in shard-1 and
# Z-055 in shard-2; run E reads both.
[positions.shared_ordinal]
conditions = [9]
ordinal = 1
shard_positions = [0, 1]
reads = [
    { shard_position = 0, record = "Z-048", segment = "E/seg-1", step = 4, sample_pos = 3 },
    { shard_position = 1, record = "Z-055", segment = "E/seg-1", step = 3, sample_pos = 2 },
]
log_lines = [
    '{"segment": "E/seg-1", "step": 4, "sample_pos": 3, "global_index": 15, "rank": 0, "shard_position": 0, "ordinal": 1, "token_start": 6, "token_end": 39}',
    '{"segment": "E/seg-1", "step": 3, "sample_pos": 2, "global_index": 10, "rank": 0, "shard_position": 1, "ordinal": 1, "token_start": 29, "token_end": 40}',
]

# The split document (condition 10). B-007 (document 8 of shard-2) lies across two
# packed samples: one ends with its tokens 0 to 4, the next one starts at its token
# 3, the token the two samples share, and reads on to token 36. Run E reads the
# first of the two at step 1 and the second at step 12.
[positions.split_document]
conditions = [10]
shard_position = 1
ordinal = 8
record = "B-007"
rows = [
    { segment = "E/seg-1", step = 1, sample_pos = 0, token_start = 0, token_end = 4 },
    { segment = "E/seg-2", step = 12, sample_pos = 2, token_start = 3, token_end = 36 },
]
log_lines = [
    '{"segment": "E/seg-1", "step": 1, "sample_pos": 0, "global_index": 0, "rank": 0, "shard_position": 1, "ordinal": 8, "token_start": 0, "token_end": 4}',
    '{"segment": "E/seg-2", "step": 12, "sample_pos": 2, "global_index": 46, "rank": 0, "shard_position": 1, "ordinal": 8, "token_start": 3, "token_end": 36}',
]

# W, the document read only through a shared token (condition 12; DECISIONS.md
# D-13 as amended by D-24). W is Z-089, document 18 of shard-3. The third sample
# of step 9 (global index 34) reads 32 tokens of Z-070 (document 6, tokens 19 to
# 51) and, as its 33rd token, token 0 of W. That is the only row of steps 1 to 9
# that names W, and it is the one document that fits the condition. The sample
# holds no row of T and is not the half-covered sample of step 8. (Step 10 reads W
# again, whole, after checkpoint 9; the condition does not look there.)
[positions.shared_token]
conditions = [12]
fixed = { segment = "E/seg-2", shard = "shard-3", source = "Z", token_start = 0, token_end = 1, before_checkpoint = "E@6", after_checkpoint = "E@9" }
record = "Z-089"
source = "Z"
shard_position = 2
ordinal = 18
step = 9
sample_pos = 2
global_index = 34
documents_that_fit = 1
log_lines = [
    '{"segment": "E/seg-2", "step": 9, "sample_pos": 2, "global_index": 34, "rank": 0, "shard_position": 2, "ordinal": 6, "token_start": 19, "token_end": 51}',
    '{"segment": "E/seg-2", "step": 9, "sample_pos": 2, "global_index": 34, "rank": 0, "shard_position": 2, "ordinal": 18, "token_start": 0, "token_end": 1}',
]

# Segment 1 reads both of its shards (condition 11): one row on each.
[positions.seg1_shards]
conditions = [11]
log_lines = [
    '{"segment": "E/seg-1", "step": 1, "sample_pos": 1, "global_index": 1, "rank": 0, "shard_position": 0, "ordinal": 8, "token_start": 22, "token_end": 44}',
    '{"segment": "E/seg-1", "step": 1, "sample_pos": 0, "global_index": 0, "rank": 0, "shard_position": 1, "ordinal": 17, "token_start": 21, "token_end": 50}',
]

# Run D (condition 13): 12 samples in steps 1 to 3, global indices 0 to 11, every
# row on shard-1 or shard-2. "samples" lists [step, sample_pos, global_index]; the
# log lines are the whole log of the run.
[positions.D]
conditions = [13]
samples = [[1, 0, 0], [1, 1, 1], [1, 2, 2], [1, 3, 3], [2, 0, 4], [2, 1, 5], [2, 2, 6], [2, 3, 7], [3, 0, 8], [3, 1, 9], [3, 2, 10], [3, 3, 11]]
log_lines = [
    '{"segment": "D/seg-1", "step": 1, "sample_pos": 0, "global_index": 0, "rank": 0, "shard_position": 1, "ordinal": 8, "token_start": 32, "token_end": 59}',
    '{"segment": "D/seg-1", "step": 1, "sample_pos": 0, "global_index": 0, "rank": 0, "shard_position": 1, "ordinal": 18, "token_start": 0, "token_end": 6}',
    '{"segment": "D/seg-1", "step": 1, "sample_pos": 1, "global_index": 1, "rank": 0, "shard_position": 0, "ordinal": 5, "token_start": 17, "token_end": 22}',
    '{"segment": "D/seg-1", "step": 1, "sample_pos": 1, "global_index": 1, "rank": 0, "shard_position": 0, "ordinal": 15, "token_start": 0, "token_end": 28}',
    '{"segment": "D/seg-1", "step": 1, "sample_pos": 2, "global_index": 2, "rank": 0, "shard_position": 1, "ordinal": 4, "token_start": 37, "token_end": 53}',
    '{"segment": "D/seg-1", "step": 1, "sample_pos": 2, "global_index": 2, "rank": 0, "shard_position": 1, "ordinal": 2, "token_start": 0, "token_end": 17}',
    '{"segment": "D/seg-1", "step": 1, "sample_pos": 3, "global_index": 3, "rank": 0, "shard_position": 0, "ordinal": 0, "token_start": 2, "token_end": 35}',
    '{"segment": "D/seg-1", "step": 2, "sample_pos": 0, "global_index": 4, "rank": 0, "shard_position": 1, "ordinal": 3, "token_start": 34, "token_end": 47}',
    '{"segment": "D/seg-1", "step": 2, "sample_pos": 0, "global_index": 4, "rank": 0, "shard_position": 1, "ordinal": 0, "token_start": 0, "token_end": 20}',
    '{"segment": "D/seg-1", "step": 2, "sample_pos": 1, "global_index": 5, "rank": 0, "shard_position": 0, "ordinal": 11, "token_start": 4, "token_end": 37}',
    '{"segment": "D/seg-1", "step": 2, "sample_pos": 2, "global_index": 6, "rank": 0, "shard_position": 1, "ordinal": 11, "token_start": 24, "token_end": 54}',
    '{"segment": "D/seg-1", "step": 2, "sample_pos": 2, "global_index": 6, "rank": 0, "shard_position": 1, "ordinal": 3, "token_start": 0, "token_end": 3}',
    '{"segment": "D/seg-1", "step": 2, "sample_pos": 3, "global_index": 7, "rank": 0, "shard_position": 0, "ordinal": 17, "token_start": 16, "token_end": 49}',
    '{"segment": "D/seg-1", "step": 3, "sample_pos": 0, "global_index": 8, "rank": 0, "shard_position": 1, "ordinal": 17, "token_start": 10, "token_end": 43}',
    '{"segment": "D/seg-1", "step": 3, "sample_pos": 1, "global_index": 9, "rank": 0, "shard_position": 0, "ordinal": 0, "token_start": 34, "token_end": 49}',
    '{"segment": "D/seg-1", "step": 3, "sample_pos": 1, "global_index": 9, "rank": 0, "shard_position": 0, "ordinal": 5, "token_start": 0, "token_end": 18}',
    '{"segment": "D/seg-1", "step": 3, "sample_pos": 2, "global_index": 10, "rank": 0, "shard_position": 1, "ordinal": 0, "token_start": 19, "token_end": 22}',
    '{"segment": "D/seg-1", "step": 3, "sample_pos": 2, "global_index": 10, "rank": 0, "shard_position": 1, "ordinal": 15, "token_start": 0, "token_end": 30}',
    '{"segment": "D/seg-1", "step": 3, "sample_pos": 3, "global_index": 11, "rank": 0, "shard_position": 0, "ordinal": 15, "token_start": 27, "token_end": 52}',
    '{"segment": "D/seg-1", "step": 3, "sample_pos": 3, "global_index": 11, "rank": 0, "shard_position": 0, "ordinal": 12, "token_start": 0, "token_end": 8}',
]

# Run Y (conditions 14 and 15). T is document 7 of shard-3, shard position 2 of
# run Y. None of the 41 rows of Y's 24 samples names it. The run does read
# shard-3: the log line is its first row, tokens 19 to 52 of Z-090 (document 22).
[positions.Y]
conditions = [14, 15]
shard_position_of_T = 2
ordinal_of_T = 7
rows_that_name_T = 0
rows_in_the_log = 41
log_lines = [
    '{"segment": "Y/seg-1", "step": 1, "sample_pos": 0, "global_index": 0, "rank": 0, "shard_position": 2, "ordinal": 22, "token_start": 19, "token_end": 52}',
]

# The round-robin variant (conditions 16 and 17), from the replica's manifests of
# that build: T is line 7 of the tokenizer input of chunk 3, and chunks 1 and 2
# hold no record derived from A. Its log holds 24 samples in steps 1 to 6 and 24
# in steps 7 to 12, and no step record of the run lowers a step.
[positions.round_robin]
conditions = [16, 17]
fixed = { shard_of_T = "E-rr/shard-3" }
shard_of_T = "E-rr/shard-3"
manifest_line_of_T = { line = 7, handle = "T", origin = ["T"] }
affected_records_in_chunks_1_and_2 = []
samples_in_steps_1_to_6 = 24
samples_in_steps_7_to_12 = 24
log_lines = []

# Run K (conditions 18 to 23). The blend of shard-3 and shard-2 holds 57 samples,
# so an epoch is 14 steps: 28 indices for each of the two ranks, and the 57th
# sample is in no epoch. Steps 1 to 14 are epoch 0, steps 15 to 28 epoch 1, steps
# 29 to 40 the first 12 steps of epoch 2. The run record holds 8 shuffle digests:
# launch 0 with epoch 0, launch 1 with epochs 0, 1 and 2, each for both ranks.
# The first read of T is at step 8, by rank 1: the fourth sample of the step reads
# the end of Z-086, Z-069 whole, and tokens 0 to 9 of T. (Run K packs shard-3
# under its own seed; here T lies across two samples, and the other one, tokens 8
# to 22, is first read at step 13.) No row of steps 1 to 7 names T.
# The log lines: the first row of step 15, the step after the epoch boundary; the
# first row of step 1, on shard position 0, which is shard-3 in run K; and the
# three rows of the sample that first reads T.
[positions.K]
conditions = [18, 19, 20, 21, 22, 23]
fixed = { segment = "K/seg-1", first_read_of_T_rank = 1 }
blend_length = 57
epoch_steps = 14
step_after_the_boundary = 15
epoch_of_that_step = 1
shuffle_digests = 8
whole_epochs_compared_with_the_log = 2
